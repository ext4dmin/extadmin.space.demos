apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- deployment.yaml
- service.yaml
- namespace.yaml

configMapGenerator:
  - name: web-content
    files:
      - files/index.html

labels:
  - includeSelectors: true
    includeTemplates: true
    pairs:
      app: demo-webapp
  